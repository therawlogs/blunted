name: win-build
# Unsigned Windows x64 release candidate (NSIS). No signing certificate.
# Forever-free: no cert, no Store. SmartScreen warning on first run is expected.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
        shell: pwsh
      - run: npm test
        shell: pwsh
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        shell: pwsh
      - run: npm run build
        shell: pwsh
      - run: npm run bundle:tauri
        shell: pwsh
      - run: npx tauri build --bundles nsis
        shell: pwsh
      - name: package candidate and record SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "src-tauri/target/release/bundle/nsis/blunted-win-x64-setup.zip" -Force
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item $exe.FullName release-artifacts/
          Copy-Item "src-tauri/target/release/bundle/nsis/blunted-win-x64-setup.zip" release-artifacts/
          Copy-Item "dist/index.html" release-artifacts/
          $lines = Get-ChildItem release-artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines("release-artifacts/SHA256SUMS.txt", $lines, [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: blunted-windows-x64-unsigned
          path: |
            release-artifacts/*
