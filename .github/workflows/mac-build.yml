name: mac-build
# Ad-hoc signed Apple-Silicon candidate. No Developer ID signing or notarization.
on:
  workflow_dispatch:
  push:
    tags: ["v*-rc*"]
jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run bundle:tauri
      - run: npx tauri build --target aarch64-apple-darwin --bundles dmg
      - name: verify signature, package candidate, and record SHA-256
        run: |
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/blunted.app"
          hdiutil detach "$MOUNT"
          rmdir "$MOUNT"
          du -sh src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg || true
          du -sh src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app || true
          mkdir -p release-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/
          cp dist/index.html release-artifacts/
          cd release-artifacts
          shasum -a 256 * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blunted-macos-aarch64-unsigned
          path: |
            release-artifacts/*
